# Each time new commits reach the "main" branch on GitHub, this builds the
# dashboard and publishes it with GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also allows starting it by hand from the "Actions" tab on GitHub.
  workflow_dispatch:

# The permissions GitHub Pages needs to publish the site.
permissions:
  contents: read
  pages: write
  id-token: write

# If two runs overlap, let the newer one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the libraries
        run: npm ci
        working-directory: web
      - name: Build the site
        run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
